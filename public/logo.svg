<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a3d7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Octopus Body -->
  <g transform="translate(120, 80)">
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="45" ry="40" fill="url(#purpleGradient)" stroke="#5a3d7a" stroke-width="2" filter="url(#glow)"/>
    
    <!-- Eyes -->
    <circle cx="-15" cy="-5" r="12" fill="#ffffff" opacity="0.95"/>
    <circle cx="15" cy="-5" r="12" fill="#ffffff" opacity="0.95"/>
    <circle cx="-15" cy="-5" r="8" fill="#4facfe"/>
    <circle cx="15" cy="-5" r="8" fill="#4facfe"/>
    <circle cx="-15" cy="-5" r="5" fill="#000000"/>
    <circle cx="15" cy="-5" r="5" fill="#000000"/>
    <circle cx="-13" cy="-7" r="2" fill="#ffffff"/>
    <circle cx="17" cy="-7" r="2" fill="#ffffff"/>
    
    <!-- Nose -->
    <circle cx="-5" cy="2" r="2" fill="#5a3d7a"/>
    <circle cx="0" cy="2" r="2" fill="#5a3d7a"/>
    <circle cx="5" cy="2" r="2" fill="#5a3d7a"/>
    
    <!-- Mouth -->
    <path d="M -20 15 Q 0 25 20 15" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="-18" y="12" width="4" height="6" rx="2" fill="#ffffff"/>
    <rect x="-10" y="12" width="4" height="6" rx="2" fill="#ffffff"/>
    <rect x="-2" y="12" width="4" height="6" rx="2" fill="#ffffff"/>
    <rect x="6" y="12" width="4" height="6" rx="2" fill="#ffffff"/>
    <rect x="14" y="12" width="4" height="6" rx="2" fill="#ffffff"/>
    
    <!-- Left Arm (Flexing) -->
    <ellipse cx="-50" cy="10" rx="15" ry="25" fill="url(#purpleGradient)" stroke="#5a3d7a" stroke-width="2"/>
    <ellipse cx="-50" cy="5" rx="8" ry="12" fill="#667eea" opacity="0.6"/>
    <circle cx="-50" cy="-5" r="8" fill="url(#purpleGradient)" stroke="#5a3d7a" stroke-width="1.5"/>
    
    <!-- Right Arm (Thumbs Up) -->
    <ellipse cx="50" cy="10" rx="15" ry="25" fill="url(#purpleGradient)" stroke="#5a3d7a" stroke-width="2"/>
    <ellipse cx="50" cy="5" rx="8" ry="12" fill="#667eea" opacity="0.6"/>
    <circle cx="50" cy="-5" r="8" fill="url(#purpleGradient)" stroke="#5a3d7a" stroke-width="1.5"/>
    <!-- Thumb -->
    <ellipse cx="58" cy="-8" rx="5" ry="8" fill="url(#purpleGradient)" stroke="#5a3d7a" stroke-width="1.5" transform="rotate(-30 58 -8)"/>
    
    <!-- Tentacles -->
    <ellipse cx="-25" cy="35" rx="8" ry="20" fill="url(#purpleGradient)" stroke="#5a3d7a" stroke-width="1.5"/>
    <ellipse cx="-10" cy="38" rx="8" ry="22" fill="url(#purpleGradient)" stroke="#5a3d7a" stroke-width="1.5"/>
    <ellipse cx="5" cy="38" rx="8" ry="22" fill="url(#purpleGradient)" stroke="#5a3d7a" stroke-width="1.5"/>
    <ellipse cx="20" cy="35" rx="8" ry="20" fill="url(#purpleGradient)" stroke="#5a3d7a" stroke-width="1.5"/>
    
    <!-- Highlights -->
    <ellipse cx="-8" cy="-12" rx="15" ry="8" fill="#ffffff" opacity="0.3"/>
  </g>
  
  <!-- EP-FIN Text -->
  <g transform="translate(120, 180)">
    <!-- Background for text -->
    <rect x="-60" y="-18" width="120" height="36" rx="8" fill="url(#purpleDark)" stroke="#5a3d7a" stroke-width="2"/>
    
    <!-- Text -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
          fill="#ffffff" text-anchor="middle" dominant-baseline="middle" 
          stroke="#ffffff" stroke-width="0.5" opacity="0.9">
      EP-FIN
    </text>
  </g>
</svg>

