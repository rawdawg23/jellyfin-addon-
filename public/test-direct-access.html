<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellyfin Direct Access Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        h1 {
            color: #fff;
            border-bottom: 2px solid #4a9eff;
            padding-bottom: 10px;
        }
        .config-section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #b0b0b0;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            background: #4a9eff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }
        button:hover {
            background: #3a8eef;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .results {
            margin-top: 20px;
        }
        .test-result {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #4a9eff;
        }
        .test-result.success {
            border-left-color: #4caf50;
        }
        .test-result.error {
            border-left-color: #f44336;
        }
        .test-result h3 {
            margin-top: 0;
            color: #4a9eff;
        }
        .item {
            background: #1a1a1a;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        .item strong {
            color: #4a9eff;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #4a9eff;
        }
        pre {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        .index-item {
            background: #1a1a1a;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            border-left: 3px solid #4caf50;
        }
    </style>
</head>
<body>
    <h1>🔧 Jellyfin Direct Access Test</h1>
    <p style="color: #888;">Test alternative ways to access Jellyfin items directly, bypassing the broken search API</p>
    
    <div class="config-section">
        <h2>Configuration</h2>
        <div class="form-group">
            <label>Server URL:</label>
            <input type="text" id="serverUrl" placeholder="https://your-server.com" value="https://ku98faa.freshticks.xyz:443">
        </div>
        <div class="form-group">
            <label>API Key:</label>
            <input type="text" id="apiKey" placeholder="Your Jellyfin API Key" value="fdfa03901d7e47269bf4bc0c5cb197c5">
        </div>
        <div class="form-group">
            <label>User ID (optional - will auto-detect):</label>
            <input type="text" id="userId" placeholder="Leave empty to auto-detect">
        </div>
        <div class="form-group">
            <label>Test Type:</label>
            <select id="testType">
                <option value="movie">Movie</option>
                <option value="series">TV Show / Series</option>
            </select>
        </div>
        <div class="form-group">
            <label>Item ID (optional - test direct access to specific item):</label>
            <input type="text" id="itemId" placeholder="Leave empty to test with sample items">
        </div>
        <button id="runTest" onclick="runTest()">Run Direct Access Tests</button>
    </div>

    <div id="results" class="results"></div>

    <script>
        async function runTest() {
            const serverUrl = document.getElementById('serverUrl').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const userId = document.getElementById('userId').value.trim();
            const testType = document.getElementById('testType').value;
            const itemId = document.getElementById('itemId').value.trim();
            
            if (!serverUrl || !apiKey) {
                alert('Please fill in Server URL and API Key');
                return;
            }

            const button = document.getElementById('runTest');
            button.disabled = true;
            button.textContent = 'Running Tests...';

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading">⏳ Testing direct access methods...<br><small>This may take up to 1 minute</small></div>';

            // Create config object
            const config = {
                serverUrl: serverUrl.replace(/\/+$/, ''),
                accessToken: apiKey,
                userId: userId || undefined
            };

            // Convert to base64url
            const jsonStr = JSON.stringify(config);
            const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
            const cfgStr = base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');

            // Build URL
            let testUrl = `${window.location.origin}/test-direct-access?cfg=${cfgStr}&type=${testType}`;
            if (itemId) {
                testUrl += `&itemId=${encodeURIComponent(itemId)}`;
            }

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 120000);
                
                const response = await fetch(testUrl, { 
                    signal: controller.signal 
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const data = await response.json();
                displayResults(data);
            } catch (error) {
                console.error('Test error:', error);
                let errorMsg = error.message;
                if (error.name === 'AbortError') {
                    errorMsg = 'Request timed out after 2 minutes';
                }
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        <h3>❌ Error</h3>
                        <p><strong>${errorMsg}</strong></p>
                        <p>Check the browser console (F12) for more details.</p>
                    </div>
                `;
            } finally {
                button.disabled = false;
                button.textContent = 'Run Direct Access Tests';
            }
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            let html = '<h2>Test Results</h2>';
            
            html += `<div class="test-result">
                <h3>Configuration</h3>
                <p><strong>Server:</strong> ${data.config.serverUrl}</p>
                <p><strong>User ID:</strong> ${data.config.userId}</p>
                <p><strong>API Key:</strong> ${data.config.apiKeyPreview}</p>
                <p><strong>Test Type:</strong> ${data.testType || 'movie'}</p>
            </div>`;

            data.tests.forEach((test, idx) => {
                const isSuccess = !test.error;
                const className = test.error ? 'error' : 'success';
                
                html += `<div class="test-result ${className}">`;
                html += `<h3>${test.name}</h3>`;
                
                if (test.error) {
                    html += `<p><strong>Error:</strong> ${test.error}</p>`;
                    if (test.status) {
                        html += `<p><strong>HTTP Status:</strong> ${test.status}</p>`;
                    }
                } else {
                    if (test.status) {
                        html += `<p><strong>HTTP Status:</strong> ${test.status}</p>`;
                    }
                    if (test.duration !== undefined) {
                        html += `<p><strong>Duration:</strong> ${test.duration}ms</p>`;
                    }
                    if (test.totalItems !== undefined) {
                        html += `<p><strong>Total Items:</strong> ${test.totalItems}</p>`;
                    }
                    if (test.itemsReturned !== undefined) {
                        html += `<p><strong>Items Returned:</strong> ${test.itemsReturned}</p>`;
                    }
                    if (test.itemsWithImdb !== undefined) {
                        html += `<p><strong>Items with IMDb ID:</strong> ${test.itemsWithImdb}</p>`;
                    }
                    if (test.totalRecords !== undefined) {
                        html += `<p><strong>Total Records in Library:</strong> ${test.totalRecords}</p>`;
                    }
                    if (test.itemsWithProviderIds !== undefined) {
                        html += `<p><strong>Items with ProviderIds:</strong> ${test.itemsWithProviderIds}</p>`;
                    }
                    if (test.note) {
                        const noteColor = test.note.includes('✅') ? '#4caf50' : test.note.includes('⚠️') ? '#ff9800' : '#f44336';
                        html += `<p style="color: ${noteColor}; font-weight: bold;">${test.note}</p>`;
                    }
                    
                    if (test.sampleItems && test.sampleItems.length > 0) {
                        html += `<h4>Sample Items:</h4>`;
                        test.sampleItems.forEach((item, itemIdx) => {
                            const itemColor = item.hasImdb ? '#4caf50' : '#f44336';
                            html += `<div class="item" style="border-left: 4px solid ${itemColor};">`;
                            html += `<strong>Item ${itemIdx + 1}:</strong> "${item.name}"<br>`;
                            html += `<strong>ID:</strong> ${item.id}<br>`;
                            html += `<strong>Type:</strong> ${item.type}<br>`;
                            html += `<strong>ProviderIds:</strong> <pre>${JSON.stringify(item.providerIds, null, 2)}</pre>`;
                            html += `<p style="color: ${itemColor}; font-weight: bold;">${item.hasImdb ? '✅ Has IMDb ID' : '❌ No IMDb ID'}</p>`;
                            html += `</div>`;
                        });
                    }
                    
                    if (test.item) {
                        html += `<h4>Direct Access Result:</h4>`;
                        html += `<div class="item">`;
                        html += `<strong>Name:</strong> ${test.item.name}<br>`;
                        html += `<strong>ID:</strong> ${test.item.id}<br>`;
                        html += `<strong>Type:</strong> ${test.item.type}<br>`;
                        html += `<strong>ProviderIds:</strong> <pre>${JSON.stringify(test.item.providerIds, null, 2)}</pre>`;
                        html += `<strong>Has Media Sources:</strong> ${test.item.hasMediaSources ? 'Yes' : 'No'} (${test.item.mediaSourceCount})`;
                        html += `</div>`;
                    }
                    
                    if (test.sampleIndex && test.sampleIndex.length > 0) {
                        html += `<h4>Direct Access Index (Sample):</h4>`;
                        html += `<p><strong>Index Size:</strong> ${test.indexSize} items</p>`;
                        test.sampleIndex.forEach((indexItem, idx) => {
                            html += `<div class="index-item">`;
                            html += `<strong>${idx + 1}. ${indexItem.name}</strong><br>`;
                            html += `<strong>Jellyfin ID:</strong> ${indexItem.jellyfinId}<br>`;
                            html += `<strong>IMDb ID:</strong> ${indexItem.imdbId}<br>`;
                            html += `<strong>Direct URL:</strong> <code>${indexItem.directAccessUrl}</code>`;
                            html += `</div>`;
                        });
                    }
                }
                
                html += `</div>`;
            });

            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
